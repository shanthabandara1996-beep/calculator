<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
body{background:#111;display:flex;justify-content:center;padding-top:30px;font-family:sans-serif}
.box{background:#222;width:320px;padding:20px;border-radius:20px}
#d{width:100%;height:60px;font-size:28px;text-align:right;border:none;border-radius:10px;padding:10px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:55px;font-size:20px;border:none;border-radius:50%;background:#444;color:white}
.o{background:orange}
.e{background:green}
</style>
</head>
<body>
<div class="box">
<input id="d" readonly placeholder="0">
<div class="grid">
<button onclick="c()">C</button>
<button onclick="b()">⌫</button>
<button onclick="a('%')">%</button>
<button class="o" onclick="a('/')">÷</button>
<button onclick="a('7')">7</button>
<button onclick="a('8')">8</button>
<button onclick="a('9')">9</button>
<button class="o" onclick="a('*')">×</button>
<button onclick="a('4')">4</button>
<button onclick="a('5')">5</button>
<button onclick="a('6')">6</button>
<button class="o" onclick="a('-')">-</button>
<button onclick="a('1')">1</button>
<button onclick="a('2')">2</button>
<button onclick="a('3')">3</button>
<button class="o" onclick="a('+')">+</button>
<button onclick="a('0')">0</button>
<button onclick="a('00')">00</button>
<button onclick="a('.')">.</button>
<button class="e" onclick="e()">=</button>
</div>
</div>
<script>
function a(v){document.getElementById('d').value+=v}
function c(){document.getElementById('d').value=''}
function b(){let d=document.getElementById('d');d.value=d.value.slice(0,-1)}
function e(){let d=document.getElementById('d');try{d.value=eval(d.value)}catch{d.value='Error'}}
</script>
</body>
</html>
